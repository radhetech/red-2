<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" ; href="./medical form.css">
    <title>Medical Form</title>
</head>

<body>
    <h1><i>Patient Form</i></h1>
    <img src="./medical logo.jpg" height="150px" width="70px" alt="medical logo" >
    <br><br>
    <h4><u>Fill up the form and sumbit before doctor's appointment.</u></h4><br><br><br>
    <form action="http:/www.wexfordpeds.com">
        <label>First Name:</label>
        <input type="text" name="fName" value="" placeholder="first name"><br><br>
        <label>Last Name:</label>
        <input type="text" name="LName" value="" placeholder="last name"><br><br>
        <label>Date of Birth:</label>
        <input type="date"> <br><br>
        <label>Gender:</label>
        <input type="radio" name="gender"> Female
        <input type="radio" name="gender"> Male <br><br>
        <label>Address:</label>
        <textarea cols="30" rows="2"></textarea><br><br>
        <label>State:</label>
        <select>
            <option>New Jersey</option>
            <option>New York</option>
            <option>Connecticut</option>
            <option>Alabama</option>
            <option>Alaska</option>
            <option>California</option>
        </select><br><br>
        <label>Phone:</label>
        <input type="tel" name="phone" value="" placeholder="xxx-xxx-xxxx"><br><br>
        <label>Insurance Company:</label>
        <input type="text" name="Insurance" value=""><br><br>
        <label>Insurance ID:</label>
        <input type="text" name="ID" value=""><br><br>
        <label>Reason for visit:</label>
        <input type="checkbox">Physical Examintion
        <input type="checkbox">Sick visit
        <input type="checkbox">Vaccinations <br><br>
        <label>More details:</label>
        <textarea cols="100" rows="5"></textarea><br><br>
        <button>Submit form</button>

    </form>
</body>

</html>
